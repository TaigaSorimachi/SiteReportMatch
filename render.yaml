databases:
  - name: srm-database
    plan: free
    databaseName: construction_matching
    user: srm_user

services:
  - type: web
    name: srm-app
    plan: free
    runtime: node
    buildCommand: |
      cd frontend && npm install && VITE_API_BASE_URL="" npm run build && cd ..
      cd admin && npm install && VITE_API_BASE_URL="" npx vite build --base=/admin/ && cd ..
      cd backend && npm install && npx prisma generate && npm run build
      mkdir -p backend/client/frontend backend/client/admin
      cp -r frontend/dist/. backend/client/frontend/
      cp -r admin/dist/. backend/client/admin/
    startCommand: cd backend && npx prisma migrate deploy && npx prisma db seed && node dist/src/main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: srm-database
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ENV
        value: development
      - key: APP_PORT
        value: 10000
      - key: NODE_VERSION
        value: 20.11.0
